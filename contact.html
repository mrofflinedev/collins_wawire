<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <nav>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Skills and Tools</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <h1>Contact Me</h1>

    <form action="" method="post">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname"><br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname"><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"><br>

        <label for="county">Residence County:</label>
        <select name="county" id="county">
            <option value="Kakamega">Kakamega</option>
            <option value="Bungoma">Bungoma</option>
            <option value="Busia">Busia</option>
            <option value="Nairobi">Nairobi</option>
            <option value="Kwale">Kwale</option>
            <option value="Makueni">Makueni</option>
        </select><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{3}" placeholder="123-456-789"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" placeholder="Which service can I offer you?"></textarea><br><br>

        <label for="file">Upload a file:</label>
        <input type="file" id="file" name="file" multiple><br><br>

        <input type="submit" name="submit" value="Submit">
        <button type="button" onclick="alert('Hire Me')">Hire Me</button>
    </form>
</body>

</html>
